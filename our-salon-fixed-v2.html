<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>OUR SALON — Beauty, Hair, Makeup &amp; Bridal Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#fdf2f8;--card:rgba(255,255,255,.94);--card2:rgba(253,242,248,.96);--menu-bg:#ffffff;--glass-b:rgba(255,255,255,.78);--glass-in:inset 0 1px 0 rgba(255,255,255,.85);
  --ink:#1e1b4b;--mut:#6b7280;--line:rgba(219,39,119,.18);
  --pri:#db2777;--pri2:#ec4899;--pbg:rgba(219,39,119,.12);--onpri:#ffffff;
  --P:#059669;--Pb:rgba(16,185,129,.15);--A:#e11d48;--Ab:rgba(244,63,94,.15);--L:#d97706;--Lb:rgba(245,158,11,.16);--V:#7c3aed;--Vb:rgba(124,58,237,.16);
  --sh:0 8px 24px -6px rgba(190,24,93,.1),var(--glass-in);
  --sh-lg:0 18px 40px -12px rgba(190,24,93,.18),var(--glass-in)
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f0a12;--card:rgba(30,15,25,.92);--card2:rgba(40,20,35,.88);--menu-bg:#1a0f18;--glass-b:rgba(255,255,255,.12);--glass-in:inset 0 1px 0 rgba(255,255,255,.1);
  --ink:#fce7f3;--mut:#a78bfa;--line:rgba(244,114,182,.2);
  --pbg:rgba(236,72,153,.2);--onpri:#ffffff;
  --P:#34d399;--Pb:rgba(16,185,129,.2);--A:#fb7185;--Ab:rgba(244,63,94,.2);--L:#fbbf24;--Lb:rgba(245,158,11,.2);--V:#a78bfa;--Vb:rgba(167,139,250,.2);
  --sh:0 10px 26px rgba(0,0,0,.45),var(--glass-in);--sh-lg:0 22px 48px rgba(0,0,0,.65),var(--glass-in)
}}
:root[data-theme="dark"]{
  --bg:#0f0a12;--card:rgba(30,15,25,.92);--card2:rgba(40,20,35,.88);--menu-bg:#1a0f18;--glass-b:rgba(255,255,255,.12);--glass-in:inset 0 1px 0 rgba(255,255,255,.1);
  --ink:#fce7f3;--mut:#a78bfa;--line:rgba(244,114,182,.2);
  --pbg:rgba(236,72,153,.2);--onpri:#ffffff;
  --P:#34d399;--Pb:rgba(16,185,129,.2);--A:#fb7185;--Ab:rgba(244,63,94,.2);--L:#fbbf24;--Lb:rgba(245,158,11,.2);--V:#a78bfa;--Vb:rgba(167,139,250,.2);
  --sh:0 10px 26px rgba(0,0,0,.45),var(--glass-in);--sh-lg:0 22px 48px rgba(0,0,0,.65),var(--glass-in)
}

@keyframes fadeUp{from{opacity:0;transform:translate3d(0,8px,0)}to{opacity:1;transform:translate3d(0,0,0)}}
@keyframes popIn3d{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
@keyframes slideLeft{from{opacity:0;transform:translate3d(20px,0,0)}to{opacity:1;transform:translate3d(0,0,0)}}
@keyframes wave{0%,100%{transform:translateX(-8%) rotate(-2deg)}50%{transform:translateX(8%) rotate(2deg)}}
@keyframes wave2{0%,100%{transform:translateX(8%) rotate(2deg)}50%{transform:translateX(-8%) rotate(-2deg)}}
@keyframes pulseDot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.25)}}

*,*::before,*::after{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);max-width:100%;overflow-x:clip;scroll-behavior:smooth}
body{margin:0;width:100%;max-width:100%;background:var(--bg);color:var(--ink);font:14px/1.6 Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;overflow-x:clip}

#bg-fx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#bg-fx .dot-field{position:absolute;inset:-20px;background-image:radial-gradient(circle,color-mix(in srgb,var(--pri) 22%,transparent) 1.2px,transparent 1.2px);background-size:26px 26px;opacity:.4}
#bg-fx .mesh1{position:absolute;width:120vw;height:40vh;top:5%;left:-15vw;border-radius:50%;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--pri) 18%,transparent),transparent);animation:wave 12s ease-in-out infinite}
#bg-fx .mesh2{position:absolute;width:120vw;height:38vh;bottom:8%;right:-15vw;border-radius:50%;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--pri2) 15%,transparent),transparent);animation:wave2 14s ease-in-out infinite}

#app,#m,#dr,#toast{position:relative;z-index:1}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.02em;word-break:break-word}h1{font-size:22px}h2{font-size:16px}
button,input,select,textarea{font:inherit;color:inherit;max-width:100%}
input,select,textarea{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-width:0;transition:border-color .14s,box-shadow .14s,background .14s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px var(--pbg);background:var(--menu-bg)}
textarea{width:100%;min-height:80px}

.b{border:1px solid var(--glass-b);background:var(--card);box-shadow:var(--glass-in);border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:600;min-height:40px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;white-space:nowrap;flex-shrink:0;transition:transform .12s,background .14s,border-color .14s}
.b:hover:not(:disabled){background:var(--pbg);border-color:var(--pri);transform:translateY(-1px)}
.b:active:not(:disabled){transform:scale(.98)}
.b.pri{background:linear-gradient(135deg,var(--pri),var(--pri2));color:var(--onpri);border-color:rgba(255,255,255,.25);box-shadow:0 6px 16px -4px var(--pri)}
.b.wa{background:linear-gradient(135deg,#059669,#10b981);color:#ffffff;border-color:rgba(255,255,255,.25);box-shadow:0 6px 16px -4px rgba(16,185,129,.45)}
.b.del{color:var(--A);border-color:rgba(225,29,72,.3)}.b.del:hover:not(:disabled){background:var(--Ab);border-color:var(--A)}
.b.sm{padding:6px 11px;min-height:34px;font-size:12.5px;border-radius:8px}
.b:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}

.card{background:var(--card);border:1px solid var(--glass-b);border-radius:18px;padding:16px;box-shadow:var(--sh);transition:border-color .16s,box-shadow .16s;min-width:0;max-width:100%;overflow:hidden}
.card:hover{border-color:color-mix(in srgb,var(--pri) 40%,var(--glass-b));box-shadow:var(--sh-lg)}
.mut{color:var(--mut)}.sm{font-size:13px}

/* Trial Banner & Expired Box */
.trial-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;border-radius:14px;padding:10px 14px;margin-bottom:12px;border:1px solid var(--line);background:var(--card2)}
.trial-bar.warn{border-color:rgba(217,119,6,.45);background:var(--Lb)}
.trial-bar.exp{border-color:rgba(225,29,72,.45);background:var(--Ab)}
.expired-box{border:1px solid rgba(225,29,72,.45);background:color-mix(in srgb,var(--Ab) 72%,var(--card2));border-radius:18px;padding:18px;display:grid;gap:12px;text-align:center}
.buy-card{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px;display:grid;gap:8px;text-align:start}

/* Slot Chart & Overlap Alerts */
.slot-chart{border:1px solid var(--line);background:var(--card2);border-radius:14px;padding:12px;display:grid;gap:8px}
.slot-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.slot-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px}
.slot-btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px;text-align:start;cursor:pointer;display:grid;gap:2px;transition:transform .12s,border-color .12s,background .12s}
.slot-btn.free:hover{border-color:var(--P);background:var(--Pb)}
.slot-btn.free .st-lbl{color:var(--P);font-weight:700;font-size:11px}
.slot-btn.busy{border-color:rgba(225,29,72,.45);background:var(--Ab)}
.slot-btn.busy .st-lbl{color:var(--A);font-weight:700;font-size:11px}
.slot-btn.overlap{border-color:var(--A);border-width:2px;background:color-mix(in srgb,var(--Ab) 85%,var(--Lb))}
.slot-btn.overlap .st-lbl{color:var(--A);font-weight:800;font-size:11px}
.slot-btn.picked{border-color:var(--pri);box-shadow:0 0 0 2px var(--pbg)}
.conflict-warn{border-radius:12px;padding:10px 12px;background:var(--Ab);color:var(--A);border:1px solid rgba(225,29,72,.4);font-size:12.5px;font-weight:600;display:grid;gap:6px}
.overlap-item{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;background:var(--card);border:1px solid rgba(225,29,72,.3);border-radius:9px;padding:7px 10px;color:var(--ink)}

/* Public Salon Web Storefront */
.pub-wrap{max-width:1080px;margin:0 auto;padding:14px 16px 48px;display:grid;gap:18px;animation:fadeUp .18s ease-out}
.pub-nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--menu-bg);border:1px solid var(--glass-b);border-radius:16px;padding:10px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;box-shadow:var(--sh)}
.pub-links{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pub-links a{color:var(--mut);text-decoration:none;font-weight:600;font-size:13px;padding:6px 10px;border-radius:9px;transition:background .14s,color .14s}
.pub-links a:hover{background:var(--pbg);color:var(--pri)}
.hero{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:16px;align-items:stretch}
.hero-main{padding:24px;display:grid;gap:12px;align-content:start;background:radial-gradient(circle at top right,var(--pbg),transparent 62%),var(--card)}
.hero-title{font-size:28px;line-height:1.18;font-weight:800;letter-spacing:-.03em}
.article-box{padding:22px;display:grid;gap:10px}
.article-box p{margin:0;color:var(--ink);opacity:.92}
.svc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.svc-card{display:grid;gap:8px;align-content:space-between}
.svc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.price-tag{font-weight:800;color:var(--pri);font-size:15px;white-space:nowrap}
.staff-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}

.logo{font-weight:800;font-size:17px;display:inline-flex;align-items:center;gap:8px;min-width:0}
.logo span.brand-txt{background:linear-gradient(135deg,var(--pri),var(--pri2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.org-img{width:30px;height:30px;border-radius:9px;object-fit:cover;flex-shrink:0;border:1px solid var(--glass-b)}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--pbg);color:var(--pri);white-space:nowrap;flex-shrink:0;border:1px solid var(--glass-b)}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--P);display:inline-block;animation:pulseDot 2.4s ease-in-out infinite}
.sync.err i{background:var(--A);animation:none}

.shell{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:100dvh;width:100%;max-width:100%}
.shell > div{min-width:0;width:100%;max-width:100%}
.side{background:var(--card);border-right:1px solid var(--glass-b);padding:16px 12px;position:sticky;top:0;height:100dvh;display:flex;flex-direction:column;gap:3px;overflow-y:auto}
.nv{display:flex;align-items:center;gap:8px;width:100%;text-align:start;border:0;background:none;padding:10px 12px;border-radius:11px;cursor:pointer;font-weight:600;color:var(--mut);transition:background .14s,color .14s;white-space:nowrap}
.nv.on{background:var(--pbg);color:var(--pri)}.nv:hover{color:var(--ink);background:var(--card2)}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:12;background:var(--menu-bg);border-bottom:1px solid var(--glass-b);display:flex;gap:8px;align-items:center;padding:10px 18px;width:100%;max-width:100%;min-width:0}
.top .sp{flex:1;min-width:0}
.top input.top-search{width:185px}
.chip{display:flex;align-items:center;gap:7px;border:1px solid var(--glass-b);background:var(--card2);border-radius:999px;padding:4px 10px 4px 4px;cursor:pointer;flex-shrink:0;transition:border-color .14s,background .14s}
.chip:hover{border-color:var(--pri);background:var(--pbg)}
.av{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px;overflow:hidden;flex-shrink:0}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.lg-av{width:64px;height:64px;font-size:22px;border:2px solid var(--glass-b)}
.prof-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px;border:1px solid var(--glass-b);border-radius:14px;background:var(--card2)}
.role{font-size:11px;font-weight:700;background:var(--pbg);color:var(--pri);border-radius:6px;padding:2px 7px;text-transform:capitalize}

main{padding:18px;max-width:1140px;width:100%;min-width:0;animation:fadeUp .16s ease-out}
.ph{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px;min-width:0}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center;width:100%;min-width:0}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px;margin-bottom:16px;width:100%;min-width:0}
.kp .card b{display:block;font-size:22px;font-weight:800;margin-top:4px;word-break:break-word}

.bd{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.sP{background:var(--Pb);color:var(--P)}.sA{background:var(--Ab);color:var(--A)}.sL{background:var(--Lb);color:var(--L)}.sV{background:var(--Vb);color:var(--V)}.sN{background:var(--line);color:var(--mut)}
.ok{color:var(--P)}.bad{color:var(--A)}

.row{display:flex;align-items:center;gap:10px;justify-content:space-between;background:var(--card);border:1px solid var(--glass-b);border-radius:14px;padding:11px 14px;margin-bottom:8px;flex-wrap:wrap;box-shadow:var(--sh);width:100%;min-width:0}
.row:hover{border-color:var(--pri)}
.row .nm{flex:1;min-width:140px;cursor:pointer;word-break:break-word}
.seg{display:flex;gap:5px;flex-shrink:0}
.seg button{width:38px;height:36px;border:1px solid var(--glass-b);background:var(--card2);border-radius:9px;cursor:pointer;font-weight:700;color:var(--mut);font-size:12px;transition:background .12s,border-color .12s,color .12s}
.seg button:hover:not(:disabled){border-color:var(--pri);color:var(--ink)}
.seg .oP{background:var(--P);color:#fff;border-color:var(--P)}
.seg .oA{background:var(--A);color:#fff;border-color:var(--A)}
.seg .oL{background:var(--L);color:#fff;border-color:var(--L)}
.seg .oV{background:var(--V);color:#fff;border-color:var(--V)}

.tw{width:100%;max-width:100%;min-width:0;overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse}
th,td{text-align:start;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mut);font-weight:600;font-size:11.5px;text-transform:uppercase;background:var(--card2)}
tr.cl{cursor:pointer;transition:background .12s}tr.cl:hover{background:var(--pbg)}

.al{border-radius:12px;padding:11px 14px;margin-bottom:12px;background:var(--Ab);color:var(--A);font-weight:600;border:1px solid rgba(225,29,72,.25);word-break:break-word}
.kill-box{border:1px solid rgba(225,29,72,.38);background:color-mix(in srgb,var(--Ab) 65%,var(--card2));border-radius:16px;padding:14px;display:grid;gap:10px}
.emp{text-align:center;padding:24px 14px;color:var(--mut);border:1px dashed var(--line);border-radius:14px;background:var(--card2)}

.ov{position:fixed;inset:0;background:rgba(15,5,20,.55);display:grid;place-items:center;padding:12px;z-index:30}
.md{background:var(--menu-bg);border:1px solid var(--glass-b);border-radius:20px;padding:20px;width:100%;max-width:480px;max-height:88dvh;overflow:auto;display:grid;gap:12px;box-shadow:var(--sh-lg);animation:popIn3d .16s ease-out}
.md.w{max-width:640px}.mf{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:4px}

.dr{position:fixed;top:0;right:0;bottom:0;width:min(410px,100vw);background:var(--menu-bg);border-left:1px solid var(--glass-b);z-index:20;padding:16px;overflow:auto;display:grid;gap:12px;align-content:start;box-shadow:var(--sh-lg);animation:slideLeft .18s ease-out}

#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;z-index:40;opacity:0;transition:opacity .16s;pointer-events:none;max-width:calc(100vw - 24px);text-align:center;font-size:13px;box-shadow:var(--sh-lg)}
.fl{display:grid;gap:10px}.fl label{display:grid;gap:4px;font-size:13px;font-weight:500;color:var(--mut)}
.chk{display:flex;align-items:flex-start;gap:8px;cursor:pointer;font-weight:600;color:var(--ink);line-height:1.4}
.chk input{width:17px;height:17px;accent-color:var(--pri);flex-shrink:0;margin-top:2px}
.swatches{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:transform .12s}
.sw:hover{transform:scale(1.1)}.sw.on{border-color:var(--ink);transform:scale(1.12)}

/* Mobile three-dot menu */
.mob-dots-wrap{display:inline-flex;align-items:center}
.mob-dots-btn{width:36px;min-height:36px;padding:0;border-radius:10px;font-size:19px;line-height:1}
.mob-dots-backdrop{position:fixed;inset:0;z-index:28;background:rgba(15,5,20,.28)}
.mob-dots-menu{position:fixed;top:60px;right:12px;left:auto;width:min(235px,calc(100vw - 24px));max-height:calc(100dvh - 80px);overflow-y:auto;background:var(--menu-bg);border:1px solid var(--glass-b);border-radius:16px;box-shadow:var(--sh-lg);padding:8px;display:grid;gap:3px;z-index:30;animation:popIn3d .14s ease-out}
.mob-dots-menu button{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:start;border:0;background:none;padding:10px 12px;border-radius:10px;cursor:pointer;font-weight:600;font-size:13.5px;color:var(--ink)}
.mob-dots-menu button:hover,.mob-dots-menu button.on{background:var(--pbg);color:var(--pri)}
.mob-dots-menu hr{border:0;border-top:1px solid var(--line);margin:4px 6px}

@media (max-width:860px){
  h1{font-size:18px}
  .hero{grid-template-columns:minmax(0,1fr)}
  .hero-title{font-size:22px}
  .pub-links{display:none}
  .shell{grid-template-columns:minmax(0,1fr);overflow-x:clip}
  .side{display:none}
  .top{padding:8px 10px;gap:6px;flex-wrap:wrap}
  .top .sync{font-size:10.5px;padding:3px 7px}
  .top input.top-search{order:10;flex:1 1 100%;width:100%;padding:8px 10px;font-size:13.5px}
  .top .chip .role{display:none}
  .top .chip{padding:2px;border:0;background:none}
  .top .b.sm{padding:5px 8px;min-height:32px;font-size:11.5px}
  main{padding:12px;padding-bottom:32px;max-width:100%;overflow-x:clip}
  .card{padding:12px;border-radius:16px;max-width:100%}
  .kill-box{padding:10px}
  .kp{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .kp .card{padding:12px}
  .kp .card b{font-size:20px}
  .bar{gap:6px}
  .bar > input,.bar > select{flex:1 1 100%;width:100%}
  .bar > button,.bar > a.b{flex:1 1 auto;min-width:0;padding:8px 10px;font-size:12px;white-space:normal}
  .row{padding:10px 12px;gap:8px}
  .row .nm{flex:1 1 100%;min-width:0}
  .seg{width:100%;justify-content:space-between}
  .seg button{flex:1;height:38px;width:auto}
  th,td{padding:8px;font-size:12px}
}
@media print{#bg-fx,.side,.top,.bar,.mob-dots-wrap,.noprint{display:none!important}.shell{display:block}body{background:#fff}}
</style>
</head>
<body>
<div id="bg-fx" aria-hidden="true"><div class="dot-field"></div><div class="mesh1"></div><div class="mesh2"></div></div>
<div id="app"></div>
<div id="m"></div>
<div id="dr"></div>
<div id="toast"></div>

<script>
const APP_VERSION = '1.20';

async function detectClientIp(){
  const endpoints = [
    'https://api.ipify.org?format=json',
    'https://api64.ipify.org?format=json',
    'https://ipapi.co/json/'
  ];
  for(const url of endpoints){
    try{
      const ctrl = new AbortController();
      const timer = setTimeout(()=>ctrl.abort(), 3500);
      const res = await fetch(url, {signal: ctrl.signal, cache: 'no-store'});
      clearTimeout(timer);
      if(!res.ok) continue;
      const data = await res.json();
      const found = String((data && (data.ip || data.query)) || '').trim();
      if(found){
        currentIp = found;
        safeSet(IP_CACHE_KEY, JSON.stringify({ip: found, at: Date.now()}));
        return found;
      }
    }catch(e){}
  }
  return currentIp || 'local-ip';
}

function normalizeTrialDays(valDays){
  const n = parseInt(valDays, 10);
  if(Number.isNaN(n) || n < 1) return DEFAULT_TRIAL_DAYS;
  return Math.min(n, 365);
}

function getTrialDurationDays(){
  return normalizeTrialDays(owner.trialDays);
}

function ensureTrialMaps(){
  if(!owner.trialIps || typeof owner.trialIps !== 'object') owner.trialIps = {};
  if(!owner.licensedClients || typeof owner.licensedClients !== 'object') owner.licensedClients = {};
  owner.trialDays = getTrialDurationDays();
}

function getClientLicense(emailOrClient){
  ensureTrialMaps();
  const key = String(emailOrClient || '').trim().toLowerCase();
  if(!key) return null;
  const map = owner.licensedClients;
  if(Object.prototype.hasOwnProperty.call(map, key)){
    const entry = map[key];
    if(entry === false || entry === null) return null;
    if(typeof entry === 'object'){
      if(entry.active === false) return null;
      if(entry.expiresAt && Date.now() > Number(entry.expiresAt)) return null;
      return {active: true, label: entry.label || 'Licensed Client', expiresAt: entry.expiresAt || null};
    }
    if(entry) return {active: true, label: String(entry), expiresAt: null};
  }
  return null;
}

function hasActiveClientLicense(userObj){
  if(!userObj) return false;
  if(userObj.role === 'owner') return true;
  if(getClientLicense(userObj.e)) return true;
  if(userObj.clientKey && getClientLicense(userObj.clientKey)) return true;
  if(userObj.ref && getClientLicense(userObj.ref)) return true;
  return false;
}

function evaluateIpTrial(ipStr = currentIp){
  ensureTrialMaps();
  const ip = String(ipStr || 'local-ip').trim() || 'local-ip';
  const days = getTrialDurationDays();
  const durationMs = days * 24 * 60 * 60 * 1000;
  const rec = owner.trialIps[ip];

  if(!rec){
    return {
      ip,
      days,
      status: 'new',
      startedAt: null,
      expiresAt: null,
      remainingMs: durationMs,
      remainingDays: days,
      remainingHours: days * 24,
      devices: [],
      logins: []
    };
  }

  if(rec.removed){
    return {
      ip,
      days: rec.days || days,
      status: 'removed',
      startedAt: rec.startedAt || Date.now(),
      expiresAt: rec.expiresAt || Date.now(),
      remainingMs: 0,
      remainingDays: 0,
      remainingHours: 0,
      devices: Array.isArray(rec.devices) ? rec.devices : [],
      logins: Array.isArray(rec.logins) ? rec.logins : []
    };
  }

  const startedAt = Number(rec.startedAt || Date.now());
  const recDays = normalizeTrialDays(rec.days || days);
  const expiresAt = Number(rec.expiresAt || (startedAt + recDays * 24 * 60 * 60 * 1000));
  const remMs = Math.max(0, expiresAt - Date.now());
  const isExpired = remMs <= 0 || rec.status === 'expired';

  return {
    ip,
    days: recDays,
    status: isExpired ? 'expired' : 'active',
    startedAt,
    expiresAt,
    remainingMs: remMs,
    remainingDays: Math.ceil(remMs / (24 * 60 * 60 * 1000)),
    remainingHours: Math.ceil(remMs / (60 * 60 * 1000)),
    devices: Array.isArray(rec.devices) ? rec.devices : [],
    logins: Array.isArray(rec.logins) ? rec.logins : []
  };
}

function sweepExpiredTrials(saveIfChanged = false){
  ensureTrialMaps();
  let changed = false;
  const now = Date.now();
  Object.keys(owner.trialIps).forEach(ip=>{
    const rec = owner.trialIps[ip];
    if(!rec || rec.removed) return;
    const days = normalizeTrialDays(rec.days || owner.trialDays);
    const exp = Number(rec.expiresAt || (Number(rec.startedAt || now) + days * 24 * 60 * 60 * 1000));
    if(!rec.expiresAt){ rec.expiresAt = exp; changed = true; }
    if(now >= exp && rec.status !== 'expired'){
      rec.status = 'expired';
      changed = true;
    }
  });
  if(changed && saveIfChanged){
    persist();
  }
  return changed;
}

function registerIpTrialLogin(userObj, ipStr = currentIp){
  ensureTrialMaps();
  sweepExpiredTrials(false);
  const ip = String(ipStr || 'local-ip').trim() || 'local-ip';
  const days = getTrialDurationDays();
  const now = Date.now();
  let rec = owner.trialIps[ip];

  if(!rec){
    rec = {
      ip,
      days,
      startedAt: now,
      expiresAt: now + days * 24 * 60 * 60 * 1000,
      status: 'active',
      removed: false,
      devices: [DEVICE_ID],
      logins: [{email: userObj.e, role: userObj.role, deviceId: DEVICE_ID, at: now}]
    };
    owner.trialIps[ip] = rec;
    addAudit('IP Trial Started', `IP ${ip} (${days}d trial) — ${userObj.name||userObj.e}`);
    persist();
    return {allowed: true, info: evaluateIpTrial(ip)};
  }

  const info = evaluateIpTrial(ip);
  if(info.status === 'expired' || info.status === 'removed'){
    rec.status = info.status;
    persist();
    return {allowed: false, info};
  }

  if(!Array.isArray(rec.devices)) rec.devices = [];
  if(!rec.devices.includes(DEVICE_ID)) rec.devices.push(DEVICE_ID);
  if(!Array.isArray(rec.logins)) rec.logins = [];
  rec.logins.push({email: userObj.e, role: userObj.role, deviceId: DEVICE_ID, at: now});
  rec.logins = rec.logins.slice(-25);
  rec.status = 'active';
  persist();
  return {allowed: true, info: evaluateIpTrial(ip)};
}

    S.u = null;

function persist(){
  syncKillSwitchFlags();
  ensureTrialMaps();
  safeSet(STORE_KEY, JSON.stringify(db));
  safeSet(OWNER_STORE_KEY, JSON.stringify(owner));
  const sb = getSb();
  if(!sb) return;
  syncStatus = 'Saving...';
  updateSync();
  const upserts = [
    sb.from('app_state').upsert({id:MAIN_CLOUD_ID, data:db, updated_at:new Date().toISOString()},{onConflict:'id'}),
    sb.from('app_state').upsert({id:OWNER_CLOUD_ID, data:owner, updated_at:new Date().toISOString()},{onConflict:'id'})
  ];
  Promise.all(upserts)
    .then(()=>{ syncStatus='Live synced'; updateSync(); })
    .catch(()=>{ syncStatus='Sync error'; updateSync(); });
}

function updateSync(){
  $$('.sync').forEach(el=>{
    el.classList.toggle('err', syncStatus==='Sync error');
    const n = Array.from(el.childNodes).find(x=>x.nodeType===3);
    if(n) n.nodeValue = syncStatus;
  });
}

async function loadCloud(){
  await detectClientIp();
  const sb = getSb();
  if(!sb){
    enforceRemoteLock();
    render(false);
    return;
  }
  try{
    const [mainRes, ownRes] = await Promise.all([
      sb.from('app_state').select('data').eq('id',MAIN_CLOUD_ID).maybeSingle(),
      sb.from('app_state').select('data').eq('id',OWNER_CLOUD_ID).maybeSingle()
    ]);
    if(ownRes && !ownRes.error && ownRes.data && ownRes.data.data){
      const cloudOwn = {...emptyOwner(), ...ownRes.data.data};
      const localHasTrial = Object.keys((owner && owner.trialIps) || {}).length > 0 || Object.keys((owner && owner.licensedClients) || {}).length > 0;
      const cloudHasTrial = Object.keys((cloudOwn && cloudOwn.trialIps) || {}).length > 0 || Object.keys((cloudOwn && cloudOwn.licensedClients) || {}).length > 0;
      if(!cloudHasTrial && localHasTrial){
        cloudOwn.trialIps = owner.trialIps;
        cloudOwn.licensedClients = owner.licensedClients;
        cloudOwn.trialDays = owner.trialDays || DEFAULT_TRIAL_DAYS;
      }
      owner = cloudOwn;
      safeSet(OWNER_STORE_KEY, JSON.stringify(owner));
    }
    if(mainRes && !mainRes.error && mainRes.data && mainRes.data.data){
      const hasCloudRich = (Array.isArray(mainRes.data.data.clients)&&mainRes.data.data.clients.length) || (Array.isArray(mainRes.data.data.services)&&mainRes.data.data.services.length) || (mainRes.data.data.orgName && mainRes.data.data.orgName!==DEFAULT_ORG) || (typeof mainRes.data.data.globalAppLocked==='boolean');
      const hasLocalRich = (Array.isArray(db.clients)&&db.clients.length) || (Array.isArray(db.services)&&db.services.length) || (db.orgName && db.orgName!==DEFAULT_ORG);
      if(hasCloudRich || !hasLocalRich){
        db = {...emptyDb(), ...mainRes.data.data};
        safeSet(STORE_KEY, JSON.stringify(db));
      }
    }
    if(typeof db.globalAppLocked === 'boolean' && typeof owner.globalAppLocked !== 'boolean'){
      owner.globalAppLocked = db.globalAppLocked;
    }
    enforceRemoteLock();
    applyAccent();
    syncStatus = 'Live synced';
    render(false);
  }catch(e){
    syncStatus='Sync error';
    enforceRemoteLock();
    render(false);
  }
  updateSync();
}

  }

function readPhotoFile(file, cb, maxSide=240){
  if(!file || !file.type.startsWith('image/')){ toast('Please select an image file'); return; }
  const reader = new FileReader();
  reader.onload = ev => {
    const img = new Image();
    img.onload = () => {
      let w = img.width, h = img.height;
      if(w > h && w > maxSide){ h = Math.round(h*maxSide/w); w = maxSide; }
      else if(h >= w && h > maxSide){ w = Math.round(w*maxSide/h); h = maxSide; }
      const cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(img, 0, 0, w, h);
      cb(cv.toDataURL('image/jpeg', 0.82));
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

function cOf(id){ return db.clients.find(c=>c.id===id); }
function sOf(id){ return db.services.find(s=>s.id===id); }
function stOf(id){ return db.staff.find(s=>s.id===id); }

function dayAppts(d){
  return (db.appts[d]||[]).slice().sort((a,b)=>a.time.localeCompare(b.time));
}

function revenueOf(d){
  let total = 0;
  (db.appts[d]||[]).forEach(a=>{
    if(a.status==='C'){
      const svc = sOf(a.serviceId);
      total += Number(a.price || (svc && svc.price) || 0);
    }
  });
  return total;
}

function pendingBills(){
  let n = 0;
  Object.values(db.bills||{}).forEach(b=>{ if(b.status!=='Paid') n++; });
  return n;
}

function isActiveSlotAppt(a){
  return a && !['X','N'].includes(a.status);
}

function getOverlappingGroups(dateStr){
  const active = (db.appts[dateStr]||[]).filter(isActiveSlotAppt);
  const byTime = {};
  active.forEach(a=>{
    if(!byTime[a.time]) byTime[a.time] = [];
    byTime[a.time].push(a);
  });
  return Object.entries(byTime)
    .filter(([, list]) => list.length >= 2)
    .sort((a, b) => a[0].localeCompare(b[0]));
}

function findSlotConflicts(dateStr, timeStr, staffId='', excludeApptId=''){
  const list = (db.appts[dateStr]||[]).filter(a=>isActiveSlotAppt(a) && a.id!==excludeApptId);
  return list.filter(a=>{
    if(a.time !== timeStr) return false;
    if(!staffId || !a.staffId) return true;
    return a.staffId === staffId;
  });
}

function slotChartHtml(dateStr, timeStr, staffId='', timeInputId='apTime', excludeApptId=''){
  const d = dateStr || TODAY;
  const active = (db.appts[d]||[]).filter(a=>isActiveSlotAppt(a) && a.id!==excludeApptId);
  const conflicts = findSlotConflicts(d, timeStr, staffId, excludeApptId);

  const slots = WORK_SLOTS.map(t=>{
    const hits = active.filter(a=>{
      if(a.time !== t) return false;
      if(!staffId || !a.staffId) return true;
      return a.staffId === staffId;
    });
    const picked = timeStr === t ? 'picked' : '';
    if(hits.length >= 2){
      const names = hits.map(h=>{ const cl=cOf(h.clientId); return cl ? cl.name.split(' ')[0] : 'Client'; }).join(' + ');
      return `<button type="button" class="slot-btn overlap ${picked}" data-a="pickSlot" data-v="${t}" data-target="${esc(timeInputId)}" title="${esc(`${t} — ${hits.length} clients booked: ${names}`)}">
        <b>${esc(t)}</b>
        <span class="st-lbl">${hits.length} Booked (Overlap!)</span>
        <span class="mut sm" style="font-size:11px">${esc(names)}</span>
      </button>`;
    }
    if(hits.length === 1){
      const hit = hits[0];
      const cl = cOf(hit.clientId);
      const st = stOf(hit.staffId);
      const who = cl ? cl.name.split(' ')[0] : 'Booked';
      const whoStaff = st ? ` (${st.name})` : '';
      return `<button type="button" class="slot-btn busy ${picked}" data-a="pickSlot" data-v="${t}" data-target="${esc(timeInputId)}" title="${esc(`${t} — ${who}${whoStaff} (${STATUS[hit.status]||hit.status})`)}">
        <b>${esc(t)}</b>
        <span class="st-lbl">Booked · ${esc(who)}</span>
      </button>`;
    }
    return `<button type="button" class="slot-btn free ${picked}" data-a="pickSlot" data-v="${t}" data-target="${esc(timeInputId)}" title="${esc(`${t} — Free slot`)}">
      <b>${esc(t)}</b>
      <span class="st-lbl">Free</span>
    </button>`;
  }).join('');

  const warnHtml = conflicts.length
    ? `<div class="conflict-warn">
        <div>${conflicts.length >= 2 ? `${conflicts.length} clients already booked` : 'Already booked'} at ${esc(timeStr)} on ${esc(fd(d))}:</div>
        ${conflicts.map(a=>{
          const cl = cOf(a.clientId);
          const st = stOf(a.staffId);
          return `<div class="overlap-item">
            <span><b>${esc(cl?cl.name:'Client')}</b> · ${esc(st?st.name:'Any staff')} (${esc(STATUS[a.status]||a.status)})</span>
            ${S.u ? `<button type="button" class="b sm" data-a="changeApptTime" data-id="${a.id}" data-date="${esc(d)}">Change Time</button>` : ''}
          </div>`;
        }).join('')}
      </div>`
    : `<div class="mut sm" style="color:var(--P);font-weight:600">Selected time ${esc(timeStr)} is open on ${esc(fd(d))}.</div>`;

  return `<div class="slot-chart">
    <div class="slot-head">
      <b>Day Slot Availability Chart (${esc(fd(d))})</b>
      <span class="mut sm">Click any slot to set time</span>
    </div>
    <div class="slot-grid">${slots}</div>
    ${warnHtml}
  </div>`;
}

function Dash(){

  const completed = appts.filter(a=>a.status==='C').length;
  const noshow = appts.filter(a=>a.status==='N').length;
  const rev = revenueOf(TODAY);
  const pend = pendingBills();
  const upcoming = appts.filter(a=>!['C','X','N'].includes(a.status)).slice(0,8);

  return `${syncKillSwitchFlags()&&S.u.role==='owner'?`<div class="al">Owner Kill Switch is currently ON — non-owner logins and portal access are paused.</div>`:''}<div class="ph"><h1>${esc(T('dash'))}</h1>
    <div class="bar" style="margin:0">
      <button class="b sm" data-a="addClient">${esc(T('addClient'))}</button>

  </div>
  <div class="kp">
    <div class="card"><span class="mut">${esc(T('todayAppts'))}</span><b>${appts.length}</b></div>
    <div class="card"><span class="mut">${esc(T('revenueToday'))}</span><b class="ok">${fmtRs(rev)}</b></div>
    <div class="card"><span class="mut">${esc(T('completed'))}</span><b class="ok">${completed}</b></div>
    <div class="card"><span class="mut">${esc(T('noShow'))}</span><b class="bad">${noshow}</b></div>
    <div class="card"><span class="mut">${esc(T('pending'))}</span><b class="${pend?'bad':'ok'}">${pend}</b></div>
  </div>
  <div class="card">
    <h2 style="margin-bottom:10px">Upcoming / Active Today</h2>
    ${upcoming.length ? upcoming.map(a=>{
      const cl = cOf(a.clientId);
      const sv = sOf(a.serviceId);
      const st = stOf(a.staffId);
      const srcTag = a.source ? ` · <span class="bd sV" style="padding:1px 7px;font-size:11px">${esc(a.source)}</span>` : '';
      return `<div class="row">
        <div class="nm" data-a="openClient" data-id="${a.clientId}">
          <b>${esc(cl?cl.name:'Client')}</b>
          <div class="mut sm">${esc(a.time)} · ${esc(sv?sv.name:'Service')} · ${esc(st?st.name:'Any')}${srcTag}</div>
        </div>
        <span class="bd ${STATUS_CLS[a.status]||'sN'}">${esc(STATUS[a.status]||a.status)}</span>
      </div>`;
    }).join('') : '<div class="emp">No active appointments for today.</div>'}
  </div>`;
}

function Appointments(){
  const q = S.q.toLowerCase();
  const list = dayAppts(S.d).filter(a=>{
    const cl = cOf(a.clientId);
    const sv = sOf(a.serviceId);
    return (!S.f || a.status===S.f) && (!q || (cl&&cl.name.toLowerCase().includes(q)) || (cl&&(cl.phone||'').includes(q)) || (cl&&(cl.email||'').toLowerCase().includes(q)) || (sv&&sv.name.toLowerCase().includes(q)));
  });

  const activeSlots = dayAppts(S.d).filter(isActiveSlotAppt);
  const overlaps = getOverlappingGroups(S.d);
  const overviewCards = WORK_SLOTS.map(t=>{
    const hits = activeSlots.filter(a=>a.time===t);
    if(hits.length >= 2){
      const names = hits.map(h=>{ const cl=cOf(h.clientId); return cl?cl.name.split(' ')[0]:'Client'; }).join(' + ');
      return `<div class="slot-btn overlap" style="cursor:default">
        <b>${esc(t)}</b>
        <span class="st-lbl">${hits.length} Booked (Overlap!)</span>
        <span class="mut sm" style="font-size:11px">${esc(names)}</span>
      </div>`;
    }
    if(hits.length === 1){
      const hit = hits[0];
      const cl = cOf(hit.clientId);
      const st = stOf(hit.staffId);
      return `<div class="slot-btn busy" style="cursor:default">
        <b>${esc(t)}</b>
        <span class="st-lbl">Booked · ${esc(cl?cl.name.split(' ')[0]:'Client')}</span>
        <span class="mut sm" style="font-size:11px">${esc(st?st.name:'Any staff')}</span>
      </div>`;
    }
    return `<div class="slot-btn free" style="cursor:default">
      <b>${esc(t)}</b>
      <span class="st-lbl">Free</span>
      <span class="mut sm" style="font-size:11px">Available</span>
    </div>`;
  }).join('');

  const overlapBannerHtml = overlaps.length ? `<div class="conflict-warn" style="margin-bottom:12px">
    <div>Same-Day Time Overlap Detected on ${esc(fd(S.d))}: ${overlaps.length} slot(s) have 2+ clients. Change time for one of them:</div>
    ${overlaps.map(([timeSlot, grp])=>`<div style="display:grid;gap:5px;margin-top:4px">
      <div class="sm"><b>At ${esc(timeSlot)} (${grp.length} clients):</b></div>
      ${grp.map(ap=>{
        const cl = cOf(ap.clientId);
        const sv = sOf(ap.serviceId);
        return `<div class="overlap-item">
          <span><b>${esc(cl?cl.name:'Client')}</b> · ${esc(sv?sv.name:'Service')} (${esc(STATUS[ap.status]||ap.status)})</span>
          <button type="button" class="b sm pri" data-a="changeApptTime" data-id="${ap.id}" data-date="${esc(S.d)}">Change Time</button>
        </div>`;
      }).join('')}
    </div>`).join('')}
  </div>` : '';

  return `<div class="ph">
    <h1>${esc(T('appointments'))}</h1>
    <div class="bar" style="margin:0">
      <input type="date" data-f="d" value="${S.d}" aria-label="Appointment date">
      <button class="b pri sm" data-a="bookAppt">${esc(T('bookAppt'))}</button>
    </div>
  </div>
  ${overlapBannerHtml}
  <div class="card" style="margin-bottom:12px">
    <div class="slot-head" style="margin-bottom:8px">
      <b>Daily Slot Chart — ${esc(fd(S.d))}</b>
      <span class="mut sm">${activeSlots.length} active slot(s) booked${overlaps.length ? ` · ${overlaps.length} overlap(s)` : ''}</span>
    </div>
    <div class="slot-grid">${overviewCards}</div>
  </div>
  <div class="bar">
    <select data-f="f" aria-label="Filter status">
      <option value="">All statuses</option>
      ${Object.entries(STATUS).map(([k,v])=>`<option value="${k}" ${S.f===k?'selected':''}>${esc(v)}</option>`).join('')}
    </select>
  </div>
  <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap">
    <span class="bd sV">Booked ${dayAppts(S.d).filter(a=>a.status==='B').length}</span>
    <span class="bd sL">Arrived / Progress ${dayAppts(S.d).filter(a=>['A','P'].includes(a.status)).length}</span>
    <span class="bd sP">Completed ${dayAppts(S.d).filter(a=>a.status==='C').length}</span>
    <span class="bd sA">Cancelled / No-show ${dayAppts(S.d).filter(a=>['X','N'].includes(a.status)).length}</span>
  </div>
  ${list.length ? list.map(a=>{
    const cl = cOf(a.clientId);
    const sv = sOf(a.serviceId);
    const st = stOf(a.staffId);
    const srcTxt = a.source ? ` · ${esc(a.source)}` : '';
    const sameTimeCount = isActiveSlotAppt(a) ? activeSlots.filter(x=>x.time===a.time).length : 0;
    const dupBadge = sameTimeCount >= 2 ? ` · <span class="bd sA" style="padding:1px 7px;font-size:11px">Same Time (${sameTimeCount})</span>` : '';
    return `<div class="row">
      <div class="nm" data-a="openClient" data-id="${a.clientId}">
        <b>${esc(cl?cl.name:'—')}</b>
        <div class="mut sm">${esc(a.time)} · ${esc(sv?sv.name:'Service')} (${fmtRs(a.price||(sv&&sv.price)||0)}) · Staff: ${esc(st?st.name:'Any')}${srcTxt}${dupBadge}</div>
      </div>
      <button type="button" class="b sm" data-a="changeApptTime" data-id="${a.id}" data-date="${esc(S.d)}">Change Time</button>
      <div class="seg">
        ${['B','A','P','C','N','X'].map(k=>`<button class="${a.status===k?'o'+(k==='B'?'V':k==='A'||k==='P'?'L':k==='C'?'P':'A'):''}" data-a="setStatus" data-id="${a.id}" data-v="${k}" title="${esc(STATUS[k])}">${k}</button>`).join('')}
      </div>
    </div>`;
  }).join('') : '<div class="emp">No appointments match on this date. Book one!</div>'}`;
}

function clientDrawerHtml(id){
  const c = cOf(id);
  if(!c) return '';
  const history = [];
  Object.entries(db.appts||{}).sort((a,b)=>b[0].localeCompare(a[0])).forEach(([d, arr])=>{
    (arr||[]).forEach(a=>{
      if(a.clientId===id){
        const sv = sOf(a.serviceId);
        history.push({d, time:a.time, status:a.status, svc:sv?sv.name:'Service', price:Number(a.price||(sv&&sv.price)||0)});
      }
    });
  });
  const totalSpent = history.filter(x=>x.status==='C').reduce((sum,x)=>sum+x.price, 0);
  return `<div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
    <div style="display:flex;align-items:center;gap:10px">${avOf(c.name,c.photo,'lg-av')}<div><h2>${esc(c.name)}</h2><div class="mut sm">${esc(c.phone||'No phone')}${c.email?` · ${esc(c.email)}`:''}</div></div></div>
    <button class="b sm" data-a="drx">Close</button>
  </div>
  <div class="card"><span class="mut sm">Completed Spend</span><b class="ok" style="display:block;font-size:22px">${fmtRs(totalSpent)}</b><div class="mut sm">${history.length} total appointments</div></div>
  <div class="card sm"><b>Notes &amp; Preferences</b><div class="mut" style="margin-top:4px">${esc(c.notes||'No notes saved.')}</div></div>
  <div class="card"><h2 style="margin-bottom:8px">Appointment History</h2>
    ${history.length ? history.slice(0,15).map(h=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)" class="sm">
      <div><b>${esc(h.svc)}</b> <span class="mut">(${fd(h.d)} · ${esc(h.time)})</span></div>

  </div>`;
}

function Reports(){
  const days = [];
  for(let i=6;i>=0;i--){
    const d = new Date(); d.setDate(d.getDate()-i);
    const ds = iso(d);
    days.push({d:ds, rev:revenueOf(ds), cnt:dayAppts(ds).filter(a=>a.status==='C').length});
  }
  const totalRev = days.reduce((s,x)=>s+x.rev,0);
  const logs = (db.audit||[]).slice(-10).reverse();
  return `<div class="ph"><h1>${esc(T('reports'))}</h1><div class="bar noprint" style="margin:0"><button class="b" data-a="csvBills">Export Bills CSV</button><button class="b pri" data-a="print">Print</button></div></div>

  </div>
  <div class="card" style="margin-bottom:14px">
    <h2 style="margin-bottom:10px">Daily Breakdown</h2>
    ${days.map(x=>`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)">

function ownerTrialManagerHtml(){
  ensureTrialMaps();

    return `<tr>

        <button type="button" class="b sm del" data-a="removeTrialIp" data-ip="${esc(ipKey)}">Remove Trial</button>
      </td>
    </tr>`;
  }).join('') : `<tr><td colspan="4" class="mut sm">No IP trials recorded yet (Current IP: <b>${esc(currentIp)}</b>).</td></tr>`;

  const clientRows = clientEntries.length ? clientEntries.map(([key, valObj])=>{

    return `<tr>

  return `<div class="card" style="margin-bottom:14px;display:grid;gap:10px">
    <h2>IP Trial, Auto-Expiry &amp; Licensed Clients</h2>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px">

    </div>
  </div>`;
}

function renderProfilePreviewHtml(name, photo, role){
  return `${avOf(name, photo, 'lg-av')}
    <div style="display:grid;gap:6px">
      <div><b>${esc(name)}</b> <span class="role">${esc(role)}</span></div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <label class="b sm" style="cursor:pointer;margin:0">${photo ? 'Change Photo' : 'Upload Photo'}<input type="file" id="profPhotoInput" accept="image/*" style="display:none"></label>
        ${photo ? `<button type="button" class="b sm" data-a="clearMyPhoto">Remove photo</button>` : ''}
      </div>
    </div>`;
}

function bindProfilePhotoInput(curName){
  const fin = $('#profPhotoInput');
  if(!fin) return;
  fin.addEventListener('change', ()=>{
    if(!fin.files || !fin.files[0]) return;
    readPhotoFile(fin.files[0], url=>{
      S.tempPhoto = url;
      const nm = val('profNameInput').trim() || curName;
      const box = $('#myProfPreview');
      if(box){
        box.innerHTML = renderProfilePreviewHtml(nm, S.tempPhoto, S.u.role);
        bindProfilePhotoInput(curName);
      }
    });
  });
}

function openMyProfileModal(){
  if(!S.u) return;
  const cur = getCurrentProfile();
  S.tempPhoto = cur.photo || '';
  modal(T('editProf'), `
    <p class="mut sm">Update your own display name and profile photo.</p>
    <div class="fl">
      <div class="prof-bar" id="myProfPreview">${renderProfilePreviewHtml(cur.name, S.tempPhoto, S.u.role)}</div>
      <label>Display Name<input id="profNameInput" value="${esc(cur.name)}" placeholder="Enter your name"></label>
    </div>
  `, T('save'), async ()=>{
    const newName = val('profNameInput').trim();
    if(!newName){ toast('Name required'); return false; }
    const newPhoto = S.tempPhoto || '';
    if(S.u.role==='owner'){
      owner.ownerName = newName;
      owner.ownerPhoto = newPhoto;
    } else if(S.u.role==='admin'){
      db.admin = {...db.admin, name: newName, photo: newPhoto};
    } else if(S.u.role==='staff'){
      const st = findStaffForUser(S.u);
      if(st){
        st.name = newName;
        st.photo = newPhoto;
        S.u = {...S.u, ref: st.id};
      }
    }
    S.u = {...S.u, name: newName};
    safeSet(SESSION_KEY, JSON.stringify(S.u));
    addAudit('Profile Updated', `${S.u.role}: ${newName}`);
    persist();
    render(false);
    toast('Profile updated');
  });
  bindProfilePhotoInput(cur.name);
}

function bindLogoFileInput(){
  const lin = $('#orgLogoInput');
  if(!lin) return;
  lin.addEventListener('change', ()=>{
    if(!lin.files || !lin.files[0]) return;
    readPhotoFile(lin.files[0], url=>{
      S.tempLogo = url;
      const box = $('#orgLogoPreview');
      if(box){
        const orgNm = val('setOrg').trim() || db.orgName;
        box.innerHTML = renderLogoBoxHtml(S.tempLogo, orgNm);
        bindLogoFileInput();
      }
    }, 180);
  });
}

function render(anim=true){
  enforceRemoteLock();
  document.title = (db.orgName||DEFAULT_ORG) + ' — Salon';
  $('#app').innerHTML = S.u ? Shell() : PublicStorefront();
  if(S.authModalOpen && !$('#m').innerHTML) openStaffOwnerModal();
  if(S.u && S.v==='settings') bindLogoFileInput();
  if(S.u && S.drawerId && cOf(S.drawerId)){
    $('#dr').innerHTML = `<aside class="dr" role="dialog" aria-label="Client details">${clientDrawerHtml(S.drawerId)}</aside>`;
  } else if(!S.drawerId){
    $('#dr').innerHTML = '';
  }
}

document.addEventListener('click', async e=>{
  if(S.mobMenuOpen && !e.target.closest('.mob-dots-wrap') && !e.target.closest('.mob-dots-menu')){
    S.mobMenuOpen = false;
    render(false);
  }
  const el = e.target.closest('[data-a]');
  if(!el) return;
  const a = el.dataset.a, id = el.dataset.id, v = el.dataset.v;

  if(a==='mobDots'){ e.stopPropagation(); S.mobMenuOpen = !S.mobMenuOpen; render(false); return; }
  if(a==='mobDotsClose'){ e.stopPropagation(); S.mobMenuOpen = false; render(false); return; }
  if(a!=='mobDots' && S.mobMenuOpen) S.mobMenuOpen = false;

  if(a==='mx'){ if(e.target===el || el.classList.contains('b')) closeM(); }
  else if(a==='mok'){ if(modal.cb && await modal.cb()===false) return; closeM(); }
  else if(a==='showTrialInfo'){ openTrialFinishedPopup(evaluateIpTrial(currentIp)); }
  else if(a==='extendTrialIp'){
    if(!S.u || S.u.role!=='owner'){ toast('Only Owner can extend trial'); return; }
    const targetIp = el.dataset.ip || currentIp;
    const days = normalizeTrialDays(val('setTrialDays') || owner.trialDays || DEFAULT_TRIAL_DAYS);
    const now = Date.now();
    const prev = owner.trialIps[targetIp] || {ip: targetIp, devices: [], logins: []};
    owner.trialIps[targetIp] = {
      ...prev,
      ip: targetIp,
      days,
      startedAt: now,
      expiresAt: now + days * 24 * 60 * 60 * 1000,
      status: 'active',
      removed: false
    };
    S.trialPopupShownFor = '';
    addAudit('Trial Extended', `IP ${targetIp} extended for ${days} days`);
    persist();
    render(false);
    toast(`Trial extended (${days}d) for ${targetIp}`);
  }
  else if(a==='removeTrialIp'){
    if(!S.u || S.u.role!=='owner'){ toast('Only Owner can remove trial'); return; }
    const targetIp = el.dataset.ip || currentIp;
    const prev = owner.trialIps[targetIp] || {ip: targetIp, devices: [], logins: []};
    owner.trialIps[targetIp] = {
      ...prev,
      ip: targetIp,
      status: 'removed',
      removed: true,
      expiresAt: Date.now() - 1000
    };
    addAudit('Trial Removed', `IP ${targetIp} trial removed & active trial cutoff triggered`);
    persist();
    render(false);
    toast(`Trial removed for ${targetIp}`);
  }
  else if(a==='revokeClientLicense'){
    if(!S.u || S.u.role!=='owner'){ toast('Only Owner can revoke client account'); return; }
    const k = el.dataset.key;
    if(k && owner.licensedClients[k]){
      delete owner.licensedClients[k];
      addAudit('Client Revoked', k);
      persist();
      render(false);
      toast('Client account revoked');
    }
  }
  else if(a==='pickSlot'){
    const targetId = el.dataset.target || 'apTime';
    const inp = $('#'+targetId);
    if(inp){
      inp.value = v;
      if(targetId === 'apTime') refreshBookingSlotChart('apDate', 'apTime', 'apStaff', 'apSlotBox');
      else if(targetId === 'cbTime') refreshBookingSlotChart('cbDate', 'cbTime', '', 'cbSlotBox');
      else if(targetId === 'rsTime'){
        const curApId = ($('#rsSlotBox') && $('#rsSlotBox').dataset.apptId) || '';
        refreshBookingSlotChart('rsDate', 'rsTime', '', 'rsSlotBox', curApId);
      }
    }
  }
  else if(a==='changeApptTime'){
    openChangeTimeModal(id, el.dataset.date || S.d || TODAY);
  }
  else if(a==='openAuthModal'){ openStaffOwnerModal(); }
  else if(a==='clientBook'){ openClientSelfBooking(id || ''); }
  else if(a==='myProfile'){ openMyProfileModal(); }
  else if(a==='openClient'){ openDr(id); }
  else if(a==='drx'){ closeDr(); }
  else if(a==='clearOrgLogo'){
    S.tempLogo = '';
    const box = $('#orgLogoPreview');
    if(box){
      const orgNm = val('setOrg').trim() || db.orgName;
      box.innerHTML = renderLogoBoxHtml('', orgNm);
      bindLogoFileInput();
    }
  }
  else if(a==='clearMyPhoto'){
    S.tempPhoto = '';
    const curName = getCurrentProfile().name;
    const nm = val('profNameInput').trim() || curName;
    const box = $('#myProfPreview');
    if(box){
      box.innerHTML = renderProfilePreviewHtml(nm, '', S.u.role);
      bindProfilePhotoInput(curName);
    }
  }
  else if(a==='pickAcc'){ S.tempAccent = v; db.accent = v; applyAccent(); render(false); }
  else if(a==='logout'){ S.u=null; safeRemove(SESSION_KEY); closeDr(); S.q=''; S.f=''; render(); }
  else if(a==='nav'){ S.v=v; S.f=''; if(v==='settings'){ S.tempAccent=db.accent; S.tempLogo=undefined; } render(); }
  else if(a==='syncNow'){ await loadCloud(); toast('Synced'); }
  else if(a==='theme'){
    const nx = document.documentElement.dataset.theme==='dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = nx;
    safeSet(THEME_KEY, nx);
    toast(nx==='dark'?'Dark mode':'Light mode');
  }
  else if(a==='bookAppt'){
    if(!db.clients.length){ toast('Add clients first'); return; }
    if(!db.services.length){ toast('Add services first'); return; }
    modal(T('bookAppt'), `
      <div class="fl">
        <label>Date<input type="date" id="apDate" value="${S.d}"></label>
        <label>Time<input type="time" id="apTime" value="11:00"></label>
        <label>Client<select id="apClient">${db.clients.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></label>
        <label>Service<select id="apService">${db.services.map(s=>`<option value="${s.id}">${esc(s.name)} (${fmtRs(s.price)})</option>`).join('')}</select></label>
        <label>Staff<select id="apStaff"><option value="">Any / Unassigned</option>${db.staff.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></label>
        <div id="apSlotBox">${slotChartHtml(S.d, '11:00', '', 'apTime')}</div>
      </div>
    `, 'Book', async ()=>{
      const date = val('apDate')||TODAY;
      const time = val('apTime')||'11:00';
      const clientId = val('apClient');
      const serviceId = val('apService');
      const staffId = val('apStaff');
      const svc = sOf(serviceId);
      const cl = cOf(clientId);
      const appt = {
        id: 'a'+Date.now(),
        clientId, serviceId, staffId,
        time, status:'B',
        price: svc ? svc.price : 0,
        createdAt: new Date().toISOString()
      };
      db.appts[date] = db.appts[date]||[];
      db.appts[date].push(appt);
      addAudit('Booked', `${cl?cl.name:'Client'} — ${svc?svc.name:'Service'} (${date} ${time})`);
      persist();
      S.d = date;
      render();
      toast('Appointment booked');
    });
  }
  else if(a==='setStatus'){
    const list = db.appts[S.d]||[];
    const ap = list.find(x=>x.id===id);
    if(!ap) return;
    ap.status = v;
    const cl = cOf(ap.clientId);
    const sv = sOf(ap.serviceId);
    if(v==='C'){
      db.bills = db.bills||{};
      const existingBill = Object.values(db.bills).find(b=>b.apptId===ap.id);
      if(!existingBill){
        const billId = 'b'+Date.now();
        db.bills[billId] = {
          clientId: ap.clientId,
          serviceName: sv?sv.name:'Service',
          amount: ap.price||(sv&&sv.price)||0,
          date: S.d,
          status: 'Pending',
          apptId: ap.id
        };
      }
    }
    addAudit('Status '+v, `${cl?cl.name:'Client'} (${sv?sv.name:'Service'} · ${STATUS[v]||v})`);
    persist();
    render();
    toast('Status: ' + (STATUS[v]||v));
  }
  else if(a==='addClient'){
    modal(T('addClient'), `
      <div class="fl">
        <label>Full Name<input id="cName" placeholder="e.g. Ayesha Khan"></label>
        <label>Phone / WhatsApp<input id="cPhone" placeholder="03001234567"></label>
        <label>Email<input id="cEmail" type="email" placeholder="ayesha@example.com"></label>
        <label>Gender<select id="cGender"><option>Female</option><option>Male</option><option>Other</option></select></label>
        <label>Notes<textarea id="cNotes" placeholder="Preferences, allergies..."></textarea></label>
      </div>
    `, 'Add', async ()=>{
      const name = val('cName').trim();
      if(!name){ toast('Name required'); return false; }
      db.clients.push({
        id:'c'+Date.now(), name,
        phone: val('cPhone').trim(),
        email: val('cEmail').trim().toLowerCase(),
        gender: val('cGender'),
        notes: val('cNotes').trim(),
        photo:''
      });
      addAudit('Client Added', name);
      persist(); render(); toast('Client added');
    });
  }
  else if(a==='editClient'){
    e.stopPropagation();
    const cl = cOf(id);
    if(!cl){ toast('Client not found'); return; }
    modal('Edit Client', `
      <div class="fl">
        <label>Full Name<input id="ecName" value="${esc(cl.name)}" placeholder="Client full name"></label>
        <label>Phone / WhatsApp<input id="ecPhone" value="${esc(cl.phone||'')}" placeholder="03001234567"></label>
        <label>Email<input id="ecEmail" type="email" value="${esc(cl.email||'')}" placeholder="client@example.com"></label>
        <label>Gender<select id="ecGender"><option ${cl.gender==='Female'?'selected':''}>Female</option><option ${cl.gender==='Male'?'selected':''}>Male</option><option ${cl.gender==='Other'?'selected':''}>Other</option></select></label>
        <label>Notes<textarea id="ecNotes" placeholder="Preferences, allergies...">${esc(cl.notes||'')}</textarea></label>
      </div>
    `, T('save'), async ()=>{
      const name = val('ecName').trim();
      if(!name){ toast('Name required'); return false; }
      const oldName = cl.name;
      cl.name = name;
      cl.phone = val('ecPhone').trim();
      cl.email = val('ecEmail').trim().toLowerCase();
      cl.gender = val('ecGender') || 'Female';
      cl.notes = val('ecNotes').trim();
      addAudit('Client Updated', `${oldName} → ${name}`);
      persist();
      if(S.drawerId===id) openDr(id);
      render();
      toast('Client updated');
    });
  }
  else if(a==='delClient'){
    e.stopPropagation();
    const cl = cOf(id);
    if(!cl) return;
    modal('Remove Client?', `<p class="mut">Remove <b>${esc(cl.name)}</b>?</p>`, 'Remove', async ()=>{
      db.clients = db.clients.filter(c=>c.id!==id);
      if(S.drawerId===id) closeDr();
      addAudit('Client Removed', cl.name);
      persist(); render(); toast('Client removed');
    });
  }
  else if(a==='addService'){
    modal(T('addService'), `
      <div class="fl">
        <label>Service Name<input id="sName" placeholder="e.g. Bridal Makeup"></label>
        <label>Category<input id="sCat" placeholder="Hair / Facial / Makeup / Bridal"></label>
        <label>Duration (minutes)<input id="sMins" type="number" value="45"></label>
        <label>Price (PKR)<input id="sPrice" type="number" value="2500"></label>
      </div>
    `, 'Add', async ()=>{
      const name = val('sName').trim();
      if(!name){ toast('Name required'); return false; }
      db.services.push({
        id:'s'+Date.now(), name,
        cat: val('sCat').trim()||'General',
        mins: Number(val('sMins'))||30,
        price: Number(val('sPrice'))||0
      });
      addAudit('Service Added', name);
      persist(); render(); toast('Service added');
    });
  }
  else if(a==='delService'){
    const sv = sOf(id);
    if(!sv) return;
    modal('Delete Service?', `<p class="mut">Delete <b>${esc(sv.name)}</b>?</p>`, 'Delete', async ()=>{
      db.services = db.services.filter(s=>s.id!==id);
      addAudit('Service Deleted', sv.name);
      persist(); render(); toast('Service deleted');
    });
  }
  else if(a==='addStaff'){
    modal(T('addStaff'), `
      <div class="fl">
        <label>Full Name<input id="stName" placeholder="e.g. Sana Beautician"></label>
        <label>Phone<input id="stPhone"></label>
        <label>Email (for login)<input id="stEmail" type="email" placeholder="sana@oursalon.pk"></label>
        <label>Password<input id="stPw" value="staff123"></label>
        <label>Skills<input id="stSkills" placeholder="Hair, Makeup, Facial"></label>
        <label>Commission %<input id="stComm" type="number" value="20"></label>
      </div>
    `, 'Add', async ()=>{
      const name = val('stName').trim();
      if(!name){ toast('Name required'); return false; }
      db.staff.push({
        id:'st'+Date.now(), name,
        phone: val('stPhone').trim(),
        email: val('stEmail').trim()||(name.toLowerCase().replace(/\W+/g,'.')+'@oursalon.pk'),
        pw: val('stPw')||'staff123',
        skills: val('stSkills').trim(),
        comm: Number(val('stComm'))||0,
        photo:''
      });
      addAudit('Staff Added', name);
      persist(); render(); toast('Staff added');
    });
  }
  else if(a==='editStaff'){
    if(!S.u || !['owner','admin'].includes(S.u.role)){ toast('Only Owner or Admin can edit staff'); return; }
    const st = stOf(id);
    if(!st){ toast('Staff not found'); return; }
    modal(T('editStaff'), `
      <div class="fl">
        <label>Full Name<input id="estName" value="${esc(st.name)}" placeholder="Staff name"></label>
        <label>Phone<input id="estPhone" value="${esc(st.phone||'')}"></label>
        <label>Email (for login)<input id="estEmail" type="email" value="${esc(st.email||'')}"></label>
        <label>Password<input id="estPw" type="text" value="${esc(st.pw||'staff123')}"></label>
        <label>Skills<input id="estSkills" value="${esc(st.skills||'')}"></label>
        <label>Commission %<input id="estComm" type="number" value="${esc(st.comm??0)}"></label>
      </div>
    `, T('save'), async ()=>{
      const newName = val('estName').trim();
      if(!newName){ toast('Name required'); return false; }
      const oldName = st.name;
      st.name = newName;
      st.phone = val('estPhone').trim();
      st.email = val('estEmail').trim().toLowerCase() || st.email;
      st.pw = val('estPw').trim() || st.pw || 'staff123';
      st.skills = val('estSkills').trim();
      st.comm = Number(val('estComm'))||0;
      if(S.u && S.u.role==='staff' && S.u.ref===st.id){
        S.u = {...S.u, name:newName, e:st.email};
        safeSet(SESSION_KEY, JSON.stringify(S.u));
      }
      addAudit('Staff Updated', `${oldName} → ${newName}`);
      persist(); render(); toast('Staff updated');
    });
  }
  else if(a==='delStaff'){
    const st = stOf(id);
    if(!st) return;
    modal('Remove Staff?', `<p class="mut">Remove <b>${esc(st.name)}</b>?</p>`, 'Remove', async ()=>{
      db.staff = db.staff.filter(s=>s.id!==id);
      addAudit('Staff Removed', st.name);
      persist(); render(); toast('Staff removed');
    });
  }
  else if(a==='markPaid'){
    if(db.bills[id]){
      db.bills[id].status='Paid';
      addAudit('Bill Paid', `${db.bills[id].serviceName||'Service'} (${fmtRs(db.bills[id].amount)})`);
      persist(); render(); toast('Marked Paid');
    }
  }
  else if(a==='saveSettings'){
    db.orgName = val('setOrg').trim()||DEFAULT_ORG;
    db.orgTagline = val('setTag').trim();
    db.aboutTitle = val('setAboutTitle').trim()||DEFAULT_ABOUT_TITLE;
    db.aboutP1 = val('setAboutP1').trim()||DEFAULT_ABOUT_P1;
    db.aboutP2 = val('setAboutP2').trim()||DEFAULT_ABOUT_P2;
    if(S.tempLogo !== undefined) db.orgLogo = S.tempLogo;
    S.tempLogo = undefined;
    db.accent = S.tempAccent || db.accent || 'pink';
    db.admin.name = val('setAName').trim()||'Manager';
    db.admin.email = val('setAEmail').trim().toLowerCase();
    db.admin.pw = val('setAPw').trim()||'admin123';

    if(S.u && S.u.role==='owner'){
      const oNm = val('setOName').trim()||DEFAULT_OWNER_NAME;
      const oEm = val('setOEmail').trim().toLowerCase()||DEFAULT_OWNER_EMAIL;
      const oPw = val('setOPw').trim()||DEFAULT_OWNER_PW;
      const lockChecked = !!($('#setGlobalLock') && $('#setGlobalLock').checked);
      const lockMsg = val('setGlobalLockMsg').trim() || DEFAULT_LOCK_MSG;
      const tDays = normalizeTrialDays(val('setTrialDays') || owner.trialDays || DEFAULT_TRIAL_DAYS);
      owner.ownerName = oNm;
      owner.ownerEmail = oEm;
      owner.ownerPw = oPw;
      owner.globalAppLocked = lockChecked;
      owner.globalLockMsg = lockMsg;
      owner.trialDays = tDays;
      db.globalAppLocked = lockChecked;
      db.globalLockMsg = lockMsg;
      S.u = {...S.u, e:oEm, name:oNm};
      safeSet(SESSION_KEY, JSON.stringify(S.u));
    } else if(S.u && S.u.role==='admin'){
      S.u = {...S.u, e:db.admin.email, name:db.admin.name};
      safeSet(SESSION_KEY, JSON.stringify(S.u));
    }

    applyAccent();
    addAudit('Settings Saved', db.orgName);
    persist(); render(); toast('Settings saved');
  }
  else if(a==='backupJson'){
    const blob = new Blob([JSON.stringify({db, owner}, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = `${(db.orgName||'our-salon').toLowerCase().replace(/\W+/g,'-')}-backup-${TODAY}.json`;
    link.click();
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
    toast('Backup exported');
  }
  else if(a==='restoreJson'){
    modal(T('restoreBak'), `<p class="mut sm">Paste a previously exported JSON backup to restore salon data.</p><textarea id="jrestore" placeholder='{"clients":[],"services":[]}'></textarea>`, 'Restore', ()=>{
      try{
        const parsed = JSON.parse(val('jrestore'));
        const srcDb = parsed && parsed.db ? parsed.db : parsed;
        if(!srcDb || !Array.isArray(srcDb.clients) || !Array.isArray(srcDb.services)) throw 0;
        db = {...emptyDb(), ...srcDb};
        if(parsed && parsed.owner) owner = {...emptyOwner(), ...parsed.owner};
        enforceRemoteLock();
        applyAccent();
        addAudit('Backup Restored', db.orgName);
        persist(); render(); toast('Backup restored');
      }catch(err){ toast('Invalid JSON backup'); return false; }
    });
  }
  else if(a==='csvBills'){
    const q = v => '"'+String(v==null?'':v).replace(/"/g,'""')+'"';
    const rows = [['Date','Client','Service','Amount','Status'].join(',')];
    Object.values(db.bills||{}).forEach(b=>{
      const cl = cOf(b.clientId);
      rows.push([b.date, cl?cl.name:'', b.serviceName||'', b.amount||0, b.status||''].map(q).join(','));
    });
    const blob = new Blob([rows.join('\n')], {type:'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = `salon-bills-${TODAY}.csv`;
    link.click();
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
    toast('Bills CSV exported');
  }
  else if(a==='print'){ window.print(); }
  else if(a==='loadDemo'){
    modal('Load Demo Data', `
      <p class="mut">Sample clients, services, staff, and today's appointments will be loaded. Existing data may be overwritten.</p>
    `, 'Load Demo', ()=>{
      seedDemo(false);
      return true;
    });
  }
  else if(a==='clearData'){
    modal('Clear All Data?', `
      <p class="mut">Clients, services, staff, appointments, and bills will be cleared. Login and owner kill switch settings will remain intact.</p>
    `, 'Clear Everything', ()=>{
      const keep = {
        orgName:db.orgName, orgTagline:db.orgTagline, orgLogo:db.orgLogo,
        aboutTitle:db.aboutTitle, aboutP1:db.aboutP1, aboutP2:db.aboutP2,
        accent:db.accent, globalAppLocked:syncKillSwitchFlags(),
        globalLockMsg:owner.globalLockMsg||db.globalLockMsg||DEFAULT_LOCK_MSG,
        admin:{...db.admin}
      };
      db = {...emptyDb(), ...keep};
      closeDr();
      persist(); render(); toast('All data cleared');
      return true;
    });
  }
});

document.addEventListener('input', e=>{
  if(e.target.id==='q' || e.target.id==='gq'){
    S.q = e.target.value;
    $$('#q, #gq').forEach(inp=>{ if(inp!==e.target && inp.value!==e.target.value) inp.value=e.target.value; });
    render(false);
  } else if(['apDate','apTime','apStaff'].includes(e.target.id)){
    refreshBookingSlotChart('apDate', 'apTime', 'apStaff', 'apSlotBox');
  } else if(['cbDate','cbTime'].includes(e.target.id)){
    refreshBookingSlotChart('cbDate', 'cbTime', '', 'cbSlotBox');
  } else if(['rsDate','rsTime'].includes(e.target.id)){
    refreshBookingSlotChart('rsDate', 'rsTime', '', 'rsSlotBox');
  }
});

document.addEventListener('change', e=>{
  if(e.target.dataset.f==='d'){ S.d = e.target.value||TODAY; render(false); }
  else if(e.target.dataset.f==='f'){ S.f = e.target.value; render(false); }
  else if(['apDate','apTime','apStaff'].includes(e.target.id)){
    refreshBookingSlotChart('apDate', 'apTime', 'apStaff', 'apSlotBox');
  } else if(['cbDate','cbTime'].includes(e.target.id)){
    refreshBookingSlotChart('cbDate', 'cbTime', '', 'cbSlotBox');
  } else if(['rsDate','rsTime'].includes(e.target.id)){
    refreshBookingSlotChart('rsDate', 'rsTime', '', 'rsSlotBox');
  }
});

document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){ closeM(); closeDr(); if(S.mobMenuOpen){ S.mobMenuOpen=false; render(false); } }
});
